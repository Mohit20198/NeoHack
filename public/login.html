<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeoHack &middot; Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: var(--bg);
    }
    .login-container {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 50px 40px;
      border-radius: var(--radius);
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .logo-container { margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .logo-text { font-size: 1.8rem; font-weight: 800; color: var(--text); }
    .login-desc { color: var(--text-muted); margin-bottom: 40px; line-height: 1.6; }
    .error-msg { color: #ef4444; margin-top: 20px; font-weight: 600; min-height: 24px; }
  </style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="login-container">
    <div class="logo-container">
      <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
        <path d="M14 2L26 8V20L14 26L2 20V8L14 2Z" stroke="url(#grad1)" stroke-width="2" fill="none"/>
        <path d="M14 8L20 11V17L14 20L8 17V11L14 8Z" fill="url(#grad1)" opacity="0.8"/>
        <defs>
          <linearGradient id="grad1" x1="2" y1="2" x2="26" y2="26" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#c084fc"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="logo-text">NeoHack</span>
    </div>
    
    <h2 style="margin-bottom: 15px; font-size: 1.5rem;">Restricted Access</h2>
    <p class="login-desc">Are you friends with admin? Please sign in with an approved Gmail account.</p>

    <!-- Google Sign-In Button -->
    <div id="g_id_onload"
         data-client_id="715718536052-1e0k29fr1n1156tekg966j1vli7cql30.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left"
         style="display: flex; justify-content: center;">
    </div>
    
    <div id="errorMsg" class="error-msg"></div>
  </div>

  <script>
    async function handleCredentialResponse(response) {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.textContent = "Verifying...";
      
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: response.credential })
        });
        
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          errorMsg.textContent = data.error || 'Authentication failed';
        }
      } catch (err) {
        errorMsg.textContent = 'Server error occurred.';
      }
    }
  </script>
</body>
</html>
