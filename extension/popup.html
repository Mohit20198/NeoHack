<!DOCTYPE html>
<html>
<head>
  <title>NeoHack Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 250px;
      padding: 15px;
      text-align: center;
      margin: 0;
    }
    h2 { margin-top: 0; color: #2563eb; font-size: 1.2rem; }
    .btn {
      background: #2563eb; color: white;
      border: none; padding: 10px 15px;
      border-radius: 6px; font-weight: bold;
      cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { background: #1d4ed8; }
    #status { margin-top: 10px; font-size: 0.9rem; color: #4b5563; min-height: 20px; }
  </style>
</head>
<body>
  <h2>NeoHack Tracker</h2>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <button id="trackAnnouncementBtn" class="btn" style="background: #10b981;">Track Announcement</button>
    <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
      <label style="display: block; margin-bottom: 5px; font-size: 12px; color: var(--text-muted);">Map Placements to Company:</label>
      <select id="companySelect" style="width: 100%; padding: 8px; border-radius: 6px; background: var(--bg-dark); color: var(--text); border: 1px solid var(--border); margin-bottom: 10px;">
        <option value="">Auto-detect from email subject</option>
      </select>
      <button id="trackPlacementBtn" class="btn">Track Placements</button>
    </div>
    <button id="trackBulkBtn" class="btn" style="background: #6366f1;">Track All Visible Inbox Announcements</button>
    <button id="trackNeopatBtn" class="btn" style="background: #ec4899;">Track Neopat Grid</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
