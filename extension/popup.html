<!DOCTYPE html>
<html>
<head>
  <title>NeoHack Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 250px;
      padding: 15px;
      text-align: center;
      margin: 0;
    }
    h2 { margin-top: 0; color: #2563eb; font-size: 1.2rem; }
    button {
      background: #2563eb; color: white;
      border: none; padding: 10px 15px;
      border-radius: 6px; font-weight: bold;
      cursor: pointer; width: 100%;
    }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 10px; font-size: 0.9rem; color: #4b5563; min-height: 20px; }
  </style>
</head>
<body>
  <h2>NeoHack Tracker</h2>
  <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Open a placement email in Gmail and click below.</p>
  <button id="trackBtn">Track Placement</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
